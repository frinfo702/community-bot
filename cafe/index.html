<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>八代カフェ</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23231812'/%3E%3Cg fill='%23f2c48a'%3E%3Ccircle cx='8' cy='5' r='2'/%3E%3Ccircle cx='11' cy='7.5' r='2'/%3E%3Ccircle cx='9.8' cy='11' r='2'/%3E%3Ccircle cx='6.2' cy='11' r='2'/%3E%3Ccircle cx='5' cy='7.5' r='2'/%3E%3C/g%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #080504;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #sound {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        padding: 6px 14px;
        border: 1px solid #7a5a3a;
        border-radius: 2px;
        background: #1a100acc;
        color: #f0d6a8;
        font: 13px/1.4 "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        letter-spacing: 0.08em;
        opacity: 0;
        transition: opacity 0.6s;
        pointer-events: none;
      }
      #sound.show {
        opacity: 1;
      }

      /* now playing: a small lacquered plaque, bottom left */
      #player {
        --ink: #160d08;
        --rim: #6b4a2c;
        --gold: #e8c48a;
        --paper: #f6e2bd;
        --muted: #a98760;
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: calc(100vw - 32px);
        padding: 7px 14px 7px 7px;
        background: color-mix(in srgb, var(--ink) 90%, transparent);
        border: 1px solid var(--rim);
        box-shadow:
          inset 0 0 0 1px #2a1a10,
          0 0 0 1px #0a0604,
          0 8px 20px #0009;
        color: var(--paper);
        opacity: 0.82;
        transition: opacity 0.3s;
      }
      #player:hover,
      #player:focus-within {
        opacity: 1;
      }
      #player .controls {
        display: flex;
        gap: 3px;
      }
      #player button {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid #4a3220;
        background: #1f140c;
        color: var(--gold);
        cursor: pointer;
      }
      #player button:hover {
        background: #2e1d10;
        border-color: var(--rim);
        color: #ffdcaa;
      }
      #player button:active {
        transform: translateY(1px);
      }
      #player button:focus-visible {
        outline: 1px solid var(--gold);
        outline-offset: 2px;
      }
      #player svg {
        width: 14px;
        height: 14px;
        shape-rendering: crispEdges;
        fill: currentColor;
      }
      #toggle .pause,
      #player.playing #toggle .play {
        display: none;
      }
      #player.playing #toggle .pause {
        display: block;
      }
      #player .meta {
        display: flex;
        flex-direction: column;
        min-width: 0;
        line-height: 1.25;
      }
      #player .label {
        color: var(--muted);
        font: 10px/1.4 "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        letter-spacing: 0.18em;
      }
      #track-title {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font: 15px/1.3 "Hiragino Mincho ProN", "Yu Mincho", serif;
        letter-spacing: 0.06em;
      }
      /* three lantern-light bars that bob while music plays */
      #player .eq {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 14px;
        margin-left: 2px;
      }
      #player .eq i {
        width: 2px;
        height: 3px;
        background: var(--gold);
        opacity: 0.7;
      }
      #player.playing .eq i {
        animation: bob 1.1s steps(4) infinite alternate;
      }
      #player.playing .eq i:nth-child(2) {
        animation-duration: 0.8s;
      }
      #player.playing .eq i:nth-child(3) {
        animation-duration: 1.4s;
      }
      @keyframes bob {
        to {
          height: 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #player.playing .eq i {
          animation: none;
          height: 9px;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="sound">クリックで音が流れます</div>
    <div id="player" role="group" aria-label="BGM">
      <div class="controls">
        <button id="prev" type="button" aria-label="前の曲">
          <svg viewBox="0 0 7 7" aria-hidden="true">
            <rect x="0" y="0" width="1" height="7" /><rect x="2" y="3" width="1" height="1" />
            <rect x="3" y="2" width="1" height="3" /><rect x="4" y="1" width="1" height="5" />
            <rect x="5" y="0" width="1" height="7" />
          </svg>
        </button>
        <button id="toggle" type="button" aria-label="再生">
          <svg class="play" viewBox="0 0 7 7" aria-hidden="true">
            <rect x="1" y="0" width="1" height="7" /><rect x="2" y="1" width="1" height="5" />
            <rect x="3" y="2" width="1" height="3" /><rect x="4" y="3" width="1" height="1" />
          </svg>
          <svg class="pause" viewBox="0 0 7 7" aria-hidden="true">
            <rect x="1" y="0" width="2" height="7" /><rect x="4" y="0" width="2" height="7" />
          </svg>
        </button>
        <button id="next" type="button" aria-label="次の曲">
          <svg viewBox="0 0 7 7" aria-hidden="true">
            <rect x="1" y="0" width="1" height="7" /><rect x="2" y="1" width="1" height="5" />
            <rect x="3" y="2" width="1" height="3" /><rect x="4" y="3" width="1" height="1" />
            <rect x="6" y="0" width="1" height="7" />
          </svg>
        </button>
      </div>
      <div class="meta">
        <span class="label">再生中 <span id="track-no">1 / 1</span></span>
        <span id="track-title" aria-live="polite">Jinja cafe</span>
      </div>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
