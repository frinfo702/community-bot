<text x="620" y="88" class="d-base" text-anchor="middle">keep / update / delete, or add</text>
<g><rect x="24" y="320" width="288" height="104" rx="9" fill="#12161a" stroke="#2b3137" stroke-width="1"/><text x="42" y="366" class="d-name">nightly 03:00 JST</text><text x="42" y="388" class="d-sub">a Durable Object alarm</text></g>
<g><rect x="344" y="320" width="300" height="104" rx="9" fill="#12161a" stroke="#2b3137" stroke-width="1"/><text x="362" y="355" class="d-name">the day, per speaker</text><text x="362" y="377" class="d-sub">chunks of six, five per speaker</text><text x="362" y="399" class="d-sub">the 30-day review on stale rows</text></g>
<g><rect x="676" y="320" width="240" height="104" rx="9" fill="#12161a" stroke="#2b3137" stroke-width="1"/><text x="694" y="366" class="d-name">nightly_runs</text><text x="694" y="388" class="d-sub">the diary + the summary</text></g>
<line x1="312" y1="372" x2="344" y2="372" stroke="#d8a657" stroke-width="1.4" stroke-linecap="round" class="flow" opacity="0.8" marker-end="url(#arrow)"/>
<text x="328" y="448" class="d-base" text-anchor="middle">the same path, actor nightly</text>
<line x1="644" y1="372" x2="676" y2="372" stroke="#d8a657" stroke-width="1.4" stroke-linecap="round" class="flow" opacity="0.8" marker-end="url(#arrow)"/>
<text x="660" y="448" class="d-base" text-anchor="middle">the diary</text>
<path d="M 494 320 L 494 235 L 636 235" fill="none" stroke="#d8a657" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="flow" opacity="0.8" marker-end="url(#arrow)"/>
<text x="500" y="227" class="d-base">rewrites the rows</text>
<line x1="850" y1="320" x2="850" y2="270" stroke="#d8a657" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 5" opacity="0.75" marker-end="url(#arrow)"/>
