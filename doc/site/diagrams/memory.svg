<svg viewBox="0 0 940 470" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memory-title memory-desc">
<title id="memory-title">How a memory moves through community-bot</title>
<desc id="memory-desc">Each turn reads the channel log and up to ten memories of the person who spoke. After the reply, the extraction asks Jev to decide and the chat model to phrase, then writes memories and records the change in memory_log. At 03:00 JST a Durable Object alarm consolidates the day per speaker, reviews rows older than thirty days, and writes a diary line into nightly_runs. A rollback replays a run's memory_log rows in reverse.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="5.5" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 8 4 L 0 8 z" fill="#d8a657" opacity=".8"/>
  </marker>
</defs>
<path d="M 700 96 L 700 48 L 168 48 L 168 96" fill="none" stroke="#d8a657" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="flow" opacity="0.8" marker-end="url(#arrow)"/>
<text x="472" y="40" class="d-base" text-anchor="middle">the next turn reads up to 10 rows</text>
<g><rect x="24" y="96" width="288" height="104" rx="9" fill="#12161a" stroke="#2b3137" stroke-width="1"/><text x="42" y="142" class="d-name">the prompt</text><text x="42" y="164" class="d-sub">the log + up to 10 rows</text></g>
<g><rect x="344" y="96" width="260" height="104" rx="9" fill="#12161a" stroke="#2b3137" stroke-width="1"/><text x="362" y="142" class="d-name">extraction</text><text x="362" y="164" class="d-sub">Jev decides, the model phrases</text><g transform="translate(574.9 110) scale(0.6250)" opacity=".92"><path fill="#b6bdc4" fill-rule="evenodd" clip-rule="evenodd" d="M10.3604 0.0713094C10.5495 -0.0544688 10.7065 -0.0082915 10.7568 0.166036L15.5703 2.79201L15.3301 3.23049L15.748 2.95315V8.80959L20.542 11.4248L20.2236 12.0078L20.7422 11.6631V23.6133C20.7422 23.8894 20.5559 24.2375 20.3262 24.3906L10.3828 31.0205V30.4024L10.1201 30.8848L5.32324 28.2686C5.12353 28.365 4.97169 28.262 4.97168 28.0117V22.1533L0.398438 19.6592C0.176221 19.7971 0 19.6973 0 19.4278V7.47756C0.000183397 7.20148 0.186363 6.85331 0.416016 6.70022L10.3604 0.0713094ZM6.26953 27.6455L10.4902 29.9473L19.4336 23.9854L15.2119 21.6836L6.26953 27.6455ZM10.7754 12.7432V18.2178C10.7753 18.4938 10.589 18.842 10.3594 18.9951L5.80371 22.0322V26.9571L14.915 20.8819V9.98342L10.7754 12.7432ZM15.7471 20.8272C15.7471 20.8297 15.7461 20.8324 15.7461 20.835L19.9102 23.1065V12.2188L15.7471 9.94826V20.8272ZM1.33984 19.0332L5.40137 21.249L9.43457 18.5596L5.37305 16.3447L1.33984 19.0332ZM0.832031 7.42287V18.3731L4.97168 15.6133V10.1387C4.97179 9.86264 5.15806 9.51452 5.3877 9.36135L9.94434 6.32424V1.34865L0.832031 7.42287ZM5.80371 15.4395L9.94336 17.6973V12.9131L5.80371 10.6553V15.4395ZM6.27148 9.7715L10.335 11.9883C10.3433 11.9822 10.3509 11.9754 10.3594 11.9697L14.374 9.29104L10.3135 7.07717L6.27148 9.7715ZM10.7764 6.18947L14.916 8.44729V3.57326L10.7764 1.31643V6.18947Z"/></g></g>
<g><rect x="636" y="96" width="280" height="104" rx="9" fill="#12161a" stroke="#2b3137" stroke-width="1"/><text x="654" y="142" class="d-name">memories</text><text x="654" y="164" class="d-sub">one row per fact, per user</text></g>
<g><rect x="636" y="208" width="280" height="62" rx="9" fill="#101315" stroke="#242a2f" stroke-width="1"/><text x="654" y="233" class="d-name">memory_log</text><text x="654" y="255" class="d-sub">before / after, actor, reason</text></g>
