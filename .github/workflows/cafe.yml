name: Cafe CI/CD

on:
  pull_request:
    paths:
      - "cafe/**"
      - ".github/workflows/cafe.yml"
  push:
    branches: [main]
    paths:
      - "cafe/**"
      - ".github/workflows/cafe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cafe/package-lock.json
      - run: npm ci
        working-directory: cafe
      - run: npm run typecheck
        working-directory: cafe
      - run: npm run build
        working-directory: cafe

  # The yachiyo-cafe Worker (the /cafe Activity) is separate from the bot, so
  # it deploys on its own. Wrangler comes from the root lockfile.
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cafe/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: cafe
      - run: npm run build
        working-directory: cafe
      - run: npx wrangler deploy --config cafe/wrangler.jsonc
